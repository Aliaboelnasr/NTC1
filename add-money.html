<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money - NTC Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .payment-method-card {
            cursor: pointer;
        }

        .payment-method-card .card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .payment-method-card.selected .card {
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }

        .payment-method-card:hover .card {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
        }

        .main-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button class="btn btn-outline-primary" onclick="navigateTo('index.html')">
                <i class="fas fa-home"></i> Home
            </button>
            <button class="btn btn-outline-primary" onclick="navigateTo('dashboard.html')">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </button>
        </div>

        <!-- Add Money Form -->
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title mb-4">Add Money to Your Account</h2>
                
                <form id="addMoneyForm" class="needs-validation" novalidate>
                    <!-- Amount Input -->
                    <div class="mb-4">
                        <label for="amount" class="form-label">Amount</label>
                        <div class="input-group">
                            <select class="form-select" id="currency" style="max-width: 100px;">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                            <input type="number" 
                                   class="form-control" 
                                   id="amount" 
                                   placeholder="Enter amount" 
                                   min="1" 
                                   step="0.01" 
                                   required>
                        </div>
                        <div class="form-text">Minimum amount: 1 USD</div>
                    </div>

                    <!-- Payment Method Selection -->
                    <div class="mb-4">
                        <label class="form-label">Select Payment Method</label>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <div class="payment-method-card" onclick="selectPaymentMethod('card')">
                                    <input type="radio" name="paymentMethod" value="card" class="d-none" required>
                                    <div class="card h-100">
                                        <div class="card-body text-center">
                                            <i class="fas fa-credit-card fa-2x mb-2"></i>
                                            <h6 class="mb-1">Credit Card</h6>
                                            <small class="text-muted">Visa, Mastercard</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="payment-method-card" onclick="selectPaymentMethod('fawry')">
                                    <input type="radio" name="paymentMethod" value="fawry" class="d-none">
                                    <div class="card h-100">
                                        <div class="card-body text-center">
                                            <i class="fas fa-store fa-2x mb-2"></i>
                                            <h6 class="mb-1">Fawry</h6>
                                            <small class="text-muted">Pay at Fawry</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="payment-method-card" onclick="selectPaymentMethod('bank')">
                                    <input type="radio" name="paymentMethod" value="bank" class="d-none">
                                    <div class="card h-100">
                                        <div class="card-body text-center">
                                            <i class="fas fa-university fa-2x mb-2"></i>
                                            <h6 class="mb-1">Bank Transfer</h6>
                                            <small class="text-muted">Direct transfer</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="payment-method-card" onclick="selectPaymentMethod('wallet')">
                                    <input type="radio" name="paymentMethod" value="wallet" class="d-none">
                                    <div class="card h-100">
                                        <div class="card-body text-center">
                                            <i class="fas fa-wallet fa-2x mb-2"></i>
                                            <h6 class="mb-1">E-Wallet</h6>
                                            <small class="text-muted">Digital payment</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100" id="proceedButton">
                        Proceed to Payment
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Navigation function with authentication
        function navigateTo(page) {
            const token = localStorage.getItem('token');
            if (!token) {
                showToast('Please log in first', 'error');
                return;
            }
            window.location.href = `${page}?token=${token}`;
        }

        // Payment handling
        let selectedPaymentMethod = '';

        function selectPaymentMethod(method) {
            // Remove selected class from all cards
            document.querySelectorAll('.payment-method-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selected class to clicked card
            const selectedCard = document.querySelector(`.payment-method-card input[value="${method}"]`).closest('.payment-method-card');
            selectedCard.classList.add('selected');
            
            // Update selected method
            selectedPaymentMethod = method;
            
            // Check the radio input
            selectedCard.querySelector('input[type="radio"]').checked = true;
        }

        // Form submission handling
        document.getElementById('addMoneyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;
            
            if (!amount || !selectedPaymentMethod) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            try {
                // Show loading state
                const button = document.getElementById('proceedButton');
                button.disabled = true;
                button.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

                // First, create an order in your system
                const orderData = {
                    amount: parseFloat(amount),
                    currency: currency,
                    paymentMethod: selectedPaymentMethod
                };

                // Call your backend to create an order and get an order ID
                const orderResponse = await fetch('/api/orders/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(orderData)
                });

                if (!orderResponse.ok) {
                    throw new Error('Failed to create order');
                }

                const { orderId } = await orderResponse.json();

                // Call the checkout session API
                const response = await fetch(`https://ecommerce.routemisr.com/api/v1/orders/checkout-session/${orderId}?url=http://localhost:5173`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        currency: currency.toLowerCase(),
                        payment_method_types: [selectedPaymentMethod]
                    })
                });

                if (!response.ok) {
                    throw new Error('Payment initiation failed');
                }

                const data = await response.json();
                
                if (data.url) {
                    // Store transaction details in localStorage for success callback
                    localStorage.setItem('pendingTransaction', JSON.stringify({
                        amount: parseFloat(amount),
                        currency: currency,
                        type: 'deposit',
                        paymentMethod: selectedPaymentMethod,
                        orderId: orderId
                    }));
                    
                    // Redirect to payment gateway
                    window.location.href = data.url;
                } else {
                    throw new Error('Invalid response from payment gateway');
                }

            } catch (error) {
                console.error('Payment error:', error);
                showToast(error.message || 'Payment processing failed', 'error');
                
                // Reset button state
                const button = document.getElementById('proceedButton');
                button.disabled = false;
                button.innerHTML = 'Proceed to Payment';
            }
        });

        // Toast notification function
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0 position-fixed bottom-0 end-0 m-3`;
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            document.body.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
            
            setTimeout(() => toast.remove(), 3000);
        }

        // Check authentication and handle success callback on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            // Check for success callback from payment gateway
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const pendingTransaction = localStorage.getItem('pendingTransaction');

            if (status === 'success' && pendingTransaction) {
                try {
                    const transaction = JSON.parse(pendingTransaction);
                    
                    // Verify payment with backend
                    const verifyResponse = await fetch('/api/payments/verify', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            orderId: transaction.orderId
                        })
                    });

                    if (!verifyResponse.ok) {
                        throw new Error('Payment verification failed');
                    }

                    const verifyData = await verifyResponse.json();

                    if (verifyData.success) {
                        // Update user's balance
                        const balanceResponse = await fetch('/api/wallet/balance', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                amount: transaction.amount,
                                currency: transaction.currency,
                                type: 'deposit',
                                source: transaction.paymentMethod,
                                orderId: transaction.orderId
                            })
                        });

                        if (balanceResponse.ok) {
                            // Create transaction object
                            const transaction = {
                                amount: transaction.amount,
                                currency: transaction.currency,
                                type: 'deposit',
                                status: 'completed',
                                source: transaction.paymentMethod,
                                isNew: true // Flag for animation
                            };

                            // Update wallet manager if it exists
                            if (window.opener && window.opener.walletManager) {
                                window.opener.walletManager.addTransaction(transaction);
                            }

                            showToast('Money added successfully!', 'success');
                            // Clear pending transaction
                            localStorage.removeItem('pendingTransaction');
                            // Redirect to wallet page after short delay
                            setTimeout(() => {
                                window.location.href = 'wallet.html';
                            }, 2000);
                        } else {
                            throw new Error('Failed to update balance');
                        }
                    } else {
                        throw new Error('Payment verification failed');
                    }
                } catch (error) {
                    console.error('Error processing payment callback:', error);
                    showToast(error.message || 'Failed to process payment', 'error');
                }
            }
        });
    </script>
</body>
</html>
